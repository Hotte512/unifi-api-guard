{{define "content"}}
<section class="narrow">
	<h1>Passwort ändern</h1>
	<form method="post" action="/password">
		<input type="hidden" name="csrf" value="{{.CSRF}}">
		<label>Aktuelles Passwort <input type="password" name="current" autocomplete="current-password" required></label>
		<label>Neues Passwort (mind. 12 Zeichen) <input type="password" name="password" minlength="12" autocomplete="new-password" required></label>
		<label>Wiederholen <input type="password" name="password2" minlength="12" autocomplete="new-password" required></label>
		<button>Ändern</button>
	</form>
</section>
{{end}}
