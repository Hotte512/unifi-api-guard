{{define "layout"}}<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniFi API Guard</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
	<a class="brand" href="/"><img src="/static/logo.svg" alt="" width="28" height="28">UniFi API Guard</a>
	{{if .LoggedIn}}
	<nav>
		<a href="/">Übersicht</a>
		<a href="/clients/new">Neuer Key</a>
		<a href="/password">Passwort</a>
		<form method="post" action="/logout" class="inline"><input type="hidden" name="csrf" value="{{.CSRF}}"><button class="link">Abmelden</button></form>
	</nav>
	{{end}}
</header>
<main>
	{{if .Error}}<p class="msg error">{{.Error}}</p>{{end}}
	{{if .Message}}<p class="msg ok">{{.Message}}</p>{{end}}
	{{template "content" .}}
</main>
<footer>
	UniFi API Guard {{if .ReleaseURL}}<a href="{{.ReleaseURL}}">{{.Version}}</a>{{else}}{{.Version}}{{end}}
	· <a href="{{.RepoURL}}">GitHub</a>
</footer>
</body>
</html>{{end}}
